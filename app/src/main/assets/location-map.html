<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>html,body{height:100%;margin:0}#map{position:absolute;inset:0}#message{position:absolute;top:10px;left:50px;right:10px;z-index:1000;background:white;padding:8px;font-family:sans-serif}</style>
</head>
<body>
  <div id="map"></div><div id="message">__LOADING__</div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const message = document.getElementById('message');
    try {
      const point = [__LAT__, __LON__];
      const map = L.map('map').setView(point, 15);
      const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
      });
      tiles.on('tileload', () => { message.style.display = 'none'; });
      tiles.on('tileerror', () => { message.textContent = __FAILED__; message.style.display = 'block'; });
      tiles.addTo(map);
      L.marker(point).addTo(map);
      new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById('map'));
    } catch (_) { message.textContent = __FAILED__; }
  </script>
</body>
</html>
